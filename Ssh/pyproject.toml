[project]
name = "sshvault"
version = "0.4.0"
description = "Clés SSH dans Vaultwarden, utilisées de façon transparente par ssh"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sshvault = "sshvault.launch:main"

[dependency-groups]
# cryptography ne sert qu'au test d'intégration (inscription Bitwarden) : absent de sshvault.
dev = ["pytest>=8", "cryptography>=42"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: conteneur Vaultwarden + vrai bw (docker et bw requis ; lancer avec -m integration)",
]
