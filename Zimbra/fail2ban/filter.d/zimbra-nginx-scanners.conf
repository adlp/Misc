# Filtre fail2ban pour /opt/zimbra/log/nginx.access.log
#
# Bannit les scanners/bots qui sondent des chemins n'ayant AUCUN rapport avec
# Zimbra (Zimbra est 100% Java/servlet, ne sert jamais de .php) : sondes
# WordPress, phpMyAdmin, .env/.git leakés, exploits Laravel/Symfony/Spring,
# webshells, etc. Une seule requête sur un de ces chemins est déjà un signal
# fort (contrairement à un simple 404 isolé), donc maxretry bas dans le jail.
#
# ⚠️ PRÉREQUIS reverse proxy : par défaut $remote_addr dans l'access log
# nginx est l'IP du dernier hop (ton reverse proxy externe si tu en as un),
# pas celle du client. Contrairement à audit.log (qui utilise oip= côté
# mailboxd via zimbraMailTrustedIP), ici c'est le module realip de nginx
# lui-même qu'il faut configurer, dans un des templates
# /opt/zimbra/conf/nginx/templates/nginx.conf.web.https.default.template (ou
# équivalent) :
#   set_real_ip_from <IP_ou_CIDR_de_ton_reverse_proxy>;
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;
# puis zmproxyctl restart. Une fois fait, $remote_addr = IP réelle du client
# directement (pas de champ oip séparé à gérer ici).
#
# ⚠️ Regex basée sur le format combined standard de nginx
# ($remote_addr - $remote_user [$time_local] "$request" $status ...), pas
# vérifiée contre un vrai nginx.access.log de ce serveur (log_format Zimbra
# peut différer). Avant d'activer le jail, teste sur le serveur :
#   fail2ban-regex /opt/zimbra/log/nginx.access.log /etc/fail2ban/filter.d/zimbra-nginx-scanners.conf
# et ajuste si besoin (log_format custom, colonnes déplacées, etc.).

[Definition]

badpaths = wp-login|wp-admin|wp-content|wp-includes|wp-json|xmlrpc\.php|\.env|\.git/|\.aws/credentials|phpmyadmin|pma/|adminer|cgi-bin/|vendor/phpunit|actuator|_profiler|telescope|_ignition|\.DS_Store|HNAP1|boaform|solr/admin|owa/auth|ecp/|shell\.php|cmd\.php|config\.php|setup-config\.php|eval-stdin\.php

failregex = ^<HOST> -.*"(GET|POST|HEAD|PUT|OPTIONS|PROPFIND) [^ "]*(?:%(badpaths)s)[^ "]*
            ^<HOST> -.*"(GET|POST|HEAD|PUT|OPTIONS|PROPFIND) /[^ "]*\.php[^ "]*

ignoreregex =
