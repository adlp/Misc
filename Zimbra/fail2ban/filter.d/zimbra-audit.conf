# Filtre fail2ban pour /opt/zimbra/log/audit.log
#
# Cible les échecs d'authentification loggués par Zimbra (SOAP/webmail, IMAP,
# POP, SMTP auth) quel que soit le protocole d'entrée, puisqu'ils remontent
# tous dans audit.log via la catégorie "security".
#
# ⚠️ PRÉREQUIS si Zimbra est derrière un reverse proxy (nginx Zimbra lui-même,
# et/ou un reverse proxy externe type WAF devant) : sans ça, "ip=" dans
# audit.log est l'IP du proxy, pas celle du client, et ce filtre bannirait le
# proxy au lieu de l'attaquant.
#   1. zmprov mcf +zimbraMailTrustedIP <IP du nginx zimbra-proxy>
#      (+ 127.0.0.1 si nginx tourne sur le même nœud que mailboxd)
#      → une fois fait, Zimbra ajoute un champ oip= (originating IP, tiré du
#        header X-Forwarded-For) à côté de ip= dans audit.log.
#   2. Si un reverse proxy externe est EN PLUS devant le nginx Zimbra :
#      sed -i 's/$proxy_add_x_forwarded_for/$http_x_forwarded_for/g' \
#          /opt/zimbra/conf/nginx/templates/*
#      zmproxyctl restart
#      (sinon le nginx Zimbra ajoute sa propre IP à X-Forwarded-For, ce qui
#      donne une liste "client_ip, proxy_ip" que Zimbra rejette avec
#      "Ignoring malformed remote address" — voir wiki.zimbra.com "How to fix
#      multiple OIP logging issue").
#
# Format attendu une fois trusted proxy configuré :
#   2026-08-19 10:22:31,123 INFO  [btpool0-246] [ip=<IP_proxy>;oip=<IP_client>;ua=ZimbraWebClient - FF (Win);] security - cmd=Auth; account=bob@example.org; protocol=soap; error=authentication failed for bob@example.org, invalid password;
#
# ⚠️ Le format exact (ordre des champs, présence de "ua=", etc.) peut varier
# selon la version de Zimbra (8.8 vs 9.x/10.x) et n'a pas été vérifié ici
# contre un audit.log réel. Avant d'activer le jail, teste sur le serveur :
#   fail2ban-regex /opt/zimbra/log/audit.log /etc/fail2ban/filter.d/zimbra-audit.conf
# et ajuste la regex si "Failregex" n'affiche pas de match sur tes lignes.

[Definition]

# oip= présent (client derrière proxy trusted) : priorité, capture l'IP réelle.
# ip= seul (accès direct, sans oip) : fallback.
failregex = ^.*\[ip=\S+;oip=<HOST>;.*\]\s+security\s+-\s+cmd=Auth;.*error=authentication failed for .*$
            ^.*\[ip=<HOST>;ua=.*\]\s+security\s+-\s+cmd=Auth;.*error=authentication failed for .*$
            ^.*\[ip=\S+;oip=<HOST>;.*\]\s+security\s+-\s+cmd=Auth;.*error=account is inactive.*$
            ^.*\[ip=<HOST>;ua=.*\]\s+security\s+-\s+cmd=Auth;.*error=account is inactive.*$

ignoreregex =
