# Filtre fail2ban pour /opt/zimbra/log/audit.log
#
# Cible les échecs d'authentification loggués par Zimbra (SOAP/webmail, IMAP,
# POP, SMTP auth) quel que soit le protocole d'entrée, puisqu'ils remontent
# tous dans audit.log via la catégorie "security".
#
# ⚠️ PRÉREQUIS si Zimbra est derrière un reverse proxy (nginx Zimbra lui-même,
# et/ou un reverse proxy externe type WAF devant) : sans ça, "ip=" dans
# audit.log est l'IP du proxy, pas celle du client, et ce filtre bannirait le
# proxy au lieu de l'attaquant.
#   1. zmprov mcf +zimbraMailTrustedIP <IP du nginx zimbra-proxy>
#      (+ 127.0.0.1 si nginx tourne sur le même nœud que mailboxd)
#      → une fois fait, Zimbra ajoute un champ oip= (originating IP, tiré du
#        header X-Forwarded-For) à côté de ip= dans audit.log.
#   2. Si un reverse proxy externe est EN PLUS devant le nginx Zimbra :
#      sed -i 's/$proxy_add_x_forwarded_for/$http_x_forwarded_for/g' \
#          /opt/zimbra/conf/nginx/templates/*
#      zmproxyctl restart
#      (sinon le nginx Zimbra ajoute sa propre IP à X-Forwarded-For, ce qui
#      donne une liste "client_ip, proxy_ip" que Zimbra rejette avec
#      "Ignoring malformed remote address" — voir wiki.zimbra.com "How to fix
#      multiple OIP logging issue").
#
# Format réel observé, http_dav (trusted proxy configuré, oip= seul dans son
# bloc, pas de ip= en paire — un premier bloc [thread:url] précède le bloc
# [oip=...;ua=...;]) :
#   2026-08-25 08:59:58,160 WARN  [qtp1608297024-173867:https://mail.example.com/principals/] [oip=77.131.12.22;ua=iOS/26.5 (23F77) remindd/3976;] security - cmd=Auth; account=valerie@example.com; protocol=http_dav; error=authentication failed for [valerie@example.com], invalid password;
#
# Format documenté par Zimbra (wiki.zimbra.com "Understanding And
# Troubleshooting Authentication Log Events" + forums.zimbra.org), imap
# derrière proxy : ip= (IP du proxy) ET oip= (IP réelle) coexistent dans le
# MÊME bloc, oip= après ip=, suivi de via=/ua=/cid= — donc PAS ancrable en
# début de bloc contrairement à ce qui était supposé initialement :
#   [...] [ip=<proxy>;oip=<IP réelle>;via=<app>,<proxy>(nginx/x.y.z);ua=Zimbra/x.y.z;cid=123;] security - cmd=Auth; account=[user@example.com]; protocol=imap; error=authentication failed for [user@example.com], invalid password;
#
# Sans trusted proxy configuré (zimbraMailTrustedIP), pas de oip= du tout,
# juste ip=<IP client ou proxy selon la topologie> — cas fallback ci-dessous.
# pop3/soap non vérifiés sur logs réels mais utilisent la même mécanique de
# logging (ZimbraLog security context) donc même format de bloc attendu.
#
# ⚠️ D'autres variantes de champs/ordre peuvent exister selon la version de
# Zimbra ou le protocole. Avant d'activer le jail, teste sur le serveur :
#   fail2ban-regex /opt/zimbra/log/audit.log /etc/fail2ban/filter.d/zimbra-audit.conf

[Definition]

# oip= n'importe où dans la ligne (client derrière proxy trusted, seul ou
# combiné avec ip=) : priorité, capture l'IP réelle. ip= sans oip= : fallback
# (pas de trusted proxy configuré, ou protocole/topologie qui n'en logue pas).
# \b avant "ip=" évite de reprendre le "ip" de l'intérieur de "oip=".
failregex = ^.*\boip=<HOST>\b.*\scmd=Auth;.*error=(authentication failed for|account is inactive).*$
            ^.*\bip=<HOST>\b.*\scmd=Auth;.*error=(authentication failed for|account is inactive).*$

ignoreregex =
