# Filtre fail2ban pour les abus sur le service postfix submission (port 587,
# éventuellement smtpd port 25 aussi — cf. regex générique ci-dessous).
#
# Cible deux signatures d'abus vues en prod (2026-09-03) :
#
# 1. Pipelining/protocole cassé juste après CONNECT — typiquement un scanner
#    ou un smuggler TLS qui balance des octets bruts (ClientHello TLS envoyé
#    en clair, junk binaire) au lieu de parler SMTP :
#    Sep  3 09:12:48 mail postfix/submission/smtpd[3264776]: improper command pipelining after CONNECT from unknown[64.226.120.165]: \026\003\001\001...
#
# 2. Reject "Access denied" sur RCPT — couvre à la fois le relais/spam
#    classique (from=/to= normaux) ET les tentatives d'injection de commande
#    façon Shellshock dans le HELO/l'adresse (payload base64 exécutant un
#    reverse shell via un callback OOB type interactsh/oast.online) :
#    Sep  3 13:57:39 mail postfix/submission/smtpd[3594857]: NOQUEUE: reject: RCPT from unknown[91.237.124.214]: 554 5.7.1 <unknown[91.237.124.214]>: Client host rejected: Access denied; from=<info@santeol.com> to=<bobbyebosele@gmail.com> proto=ESMTP helo=<y3xcfIL0>
#    Sep  3 09:37:10 mail postfix/submission/smtpd[3297338]: NOQUEUE: reject: RCPT from unknown[45.142.193.132]: 554 5.7.1 <unknown[45.142.193.132]>: Client host rejected: Access denied; from=<scanner@mx-test.invalid> to=<"...base64...">@cve.invalid> proto=ESMTP helo=<mx-test.invalid>
#
# Pas de regex séparée sur "Anonymous TLS connection established from
# unknown[IP]" (ligne qui précède le reject #3 dans les vrais logs) : une
# négociation TLS anonyme seule n'est pas malveillante en soi (beaucoup de
# clients légitimes font du chiffrement opportuniste sans auth avant
# d'échouer plus loin) — c'est le reject "Access denied" qui suit qui est le
# signal, et il matche déjà via la regex #2.
#
# Pourquoi "Access denied" est un signal fiable sur submission (587) : ce
# service n'est censé accepter que des clients authentifiés (SASL). Un
# rejet host-level ("Client host rejected: Access denied", produit par une
# RBL/access map/postscreen — PAS un "User unknown" ou souci de contenu) qui
# arrive à ce stade vient forcément d'un client qui tente de relayer/injecter
# sans auth valide : jamais du trafic légitime.
#
# ⚠️ Zimbra n'écrit PAS les logs postfix dans /opt/zimbra/log/ : postfix logue
# via syslog (facility mail), donc le chemin dépend de la distro du serveur :
#   - Debian/Ubuntu : /var/log/zimbra.log (le plus courant pour Zimbra)
#   - RHEL/CentOS/Rocky : /var/log/maillog
# Vérifier avec `grep 'postfix/submission/smtpd' <fichier candidat>` avant
# d'activer le jail, et adapter `logpath` dans jail.d/zimbra-postfix-submission.conf
# en conséquence.
#
# ⚠️ Non testé avec fail2ban-regex sur un vrai serveur (mêmes limites que les
# deux autres filtres de ce dépôt) : valider avant activation en prod avec
#   fail2ban-regex <logpath> /etc/fail2ban/filter.d/zimbra-postfix-submission.conf

[Definition]

failregex = ^.*postfix/(submission/)?smtpd\[\d+\]: improper command pipelining after \S+ from \S+\[<HOST>\]:
            ^.*postfix/(submission/)?smtpd\[\d+\]: NOQUEUE: reject: RCPT from \S+\[<HOST>\]: 554 5\.7\.1 .*Access denied;

ignoreregex =
