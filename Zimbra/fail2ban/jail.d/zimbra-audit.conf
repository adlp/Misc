# Jail fail2ban pour les échecs d'authentification Zimbra (audit.log).
# À copier/lier dans /etc/fail2ban/jail.d/ sur le serveur Zimbra.
#
# Adapte "port" à ce qui est réellement exposé publiquement (webmail HTTPS,
# IMAP/POP/SMTP si utilisés directement, admin console 7071 si accessible
# depuis l'extérieur — sinon retire-le et protège-le autrement, ex: firewall).

[zimbra-audit]
enabled  = true
filter   = zimbra-audit
logpath  = /opt/zimbra/log/audit.log
port     = 25,80,443,110,143,465,587,993,995,7071
maxretry = 5
findtime = 600
bantime  = 3600
# Ne jamais bannir la boucle locale / IP d'admin de confiance :
ignoreip = 127.0.0.1/8 ::1
