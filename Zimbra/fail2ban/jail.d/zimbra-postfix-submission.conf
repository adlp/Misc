# Jail fail2ban pour les abus sur postfix submission/smtpd (voir filter.d/
# zimbra-postfix-submission.conf pour le détail des signatures visées :
# pipelining cassé après CONNECT, reject "Access denied" sur RCPT — y compris
# tentatives d'injection de commande dans le HELO/l'adresse).
# À copier/lier dans /etc/fail2ban/jail.d/ sur le serveur Zimbra.
#
# ⚠️ logpath À VÉRIFIER : postfix logue via syslog, pas dans /opt/zimbra/log/.
# Debian/Ubuntu (Zimbra) : /var/log/zimbra.log — RHEL/CentOS : /var/log/maillog.
# Confirmer avec : grep 'postfix/submission/smtpd' <fichier candidat>
#
# maxretry bas volontairement : un seul reject "Access denied" ou une seule
# tentative de pipelining cassé sur submission est déjà un signal fort (un
# client authentifié légitime n'atteint jamais ce chemin de code) — même
# logique que zimbra-nginx-scanners.

[zimbra-postfix-submission]
enabled  = true
filter   = zimbra-postfix-submission
logpath  = /var/log/zimbra.log
port     = smtp,submission,465
maxretry = 2
findtime = 600
bantime  = 86400
ignoreip = 127.0.0.1/8 ::1
