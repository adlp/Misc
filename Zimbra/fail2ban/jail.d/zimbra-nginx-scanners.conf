# Jail fail2ban pour les scans de chemins hors-sujet (WordPress, PHP,
# phpMyAdmin, .env/.git, exploits Laravel/Spring, etc.) sur le nginx Zimbra.
# À copier/lier dans /etc/fail2ban/jail.d/ sur le serveur Zimbra.
#
# maxretry bas volontairement : une seule requête sur ces chemins est déjà un
# signal fort (Zimbra ne sert jamais de .php), pas la peine d'attendre une
# rafale comme pour un jail SSH classique. bantime plus long en conséquence.

[zimbra-nginx-scanners]
enabled  = true
filter   = zimbra-nginx-scanners
logpath  = /opt/zimbra/log/nginx.access.log
port     = http,https
maxretry = 2
findtime = 600
bantime  = 86400
ignoreip = 127.0.0.1/8 ::1
