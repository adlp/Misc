mail {
    server_name smtp.example.com;
    proxy_pass_error_message on;
    proxy on;
 
    ssl_certificate      /etc/letsencrypt/live/imap.example.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/imap.example.com/privkey.pem;

    ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    # backends fournis en IP par dom2srv.txt/mailauth.pm : pas de résolution DNS nécessaire
    resolver off;
    #ssl_verify_client   off;
    # n'a d'effet que sur protocol smtp (transmet l'IP client réelle au backend) ;
    # désactivé explicitement dans les 2 server{} smtp ci-dessous
    xclient           on;
    # backend d'auth : voir http.conf + perl-lib/mailauth.pm
    auth_http         127.0.0.1:3615/auth;

    # SMTP submission, TLS implicite (SMTPS)
    server {
        listen     465 ssl;
        protocol   smtp;
        # DIAGNOSTIC (pas encore appliqué) : xclient off -> le backend ne voit
        # jamais l'IP du client réel, seulement celle de nginx-mua. Mécanisme
        # XCLIENT détaillé dans README (section "xclient/PROXY protocol") :
        # commande SMTP à part entière, envoyée par le proxy avant MAIL FROM,
        # PAS dans la trame TCP ni dans le message. Pour activer : xclient on ;
        # ET le backend doit trust l'IP de nginx-mua via
        # smtpd_authorized_xclient_hosts (ex. dans etc+postfix/main.cf de ce
        # repo). Le backend réel ici est un Zimbra externe : main.cf y est
        # régénéré par zmconfigd — vérifier le mécanisme d'override propre à
        # la version avant d'éditer quoi que ce soit côté Zimbra.
        xclient     off;
        smtp_auth  login plain;
        smtp_capabilities "AUTH PLAIN";
        proxy      on;
        timeout     5s;
        ssl_verify_client   off;
        auth_http         127.0.0.1:3615/auth;
        }
    # SMTP submission, TLS via STARTTLS (RFC 6409)
    server {
        proxy_pass_error_message on;
        #listen     587 proxy_protocol;
        listen     587;
        starttls   on;
        protocol   smtp;
        smtp_auth  login plain cram-md5;
        # DIAGNOSTIC (pas encore appliqué) : même limite/remède que le bloc 465
        # ci-dessus (xclient off -> IP client réelle invisible côté backend).
        xclient     off;
        smtp_capabilities "PIPELINING" "ENHANCEDSTATUSCODES" "8BITMIME";
        proxy      on;
        # DIAGNOSTIC (pas encore appliqué) : si error_log (nginx.conf) montre
        # des timeouts proxy sur ce port pour des clients légitimes (mobile,
        # pièces jointes volumineuses) plutôt que pour du scan, monter cette
        # valeur (ex. 60-120s) réduit les "lost connection after DATA" côté
        # backend causés par le proxy lui-même. Contrepartie : connexions
        # tenues plus longtemps par worker si quelqu'un ouvre puis traîne
        # volontairement (charge/DoS un peu plus facile à provoquer).
        timeout     30s;
        auth_http         127.0.0.1:3615/auth;
        }
    # POP3 clair + STARTTLS
    server {
        listen    110;
        starttls   on;
        protocol  pop3;
        pop3_auth plain apop cram-md5;
        proxy      on;
        }
    # POP3 TLS implicite (POP3S)
    server {
        listen     995 ssl;
        starttls   off;
        protocol   pop3;
        pop3_auth plain apop cram-md5;
        proxy      on;
        ssl_verify_client   off;
        }
    # IMAP clair + STARTTLS
    server {
        listen   143;
        starttls   on;
        protocol imap;
        proxy      on;
        imap_capabilities  "IMAP4rev1" "LITERAL+" "SASL-IR" "LOGIN-REFERRALS" "ID" "ENABLE" "SORT" "SORT=DISPLAY" "THREAD=REFERENCES" "THREAD=REFS" "MULTIAPPEND" "UNSELECT" "IDLE" "CHILDREN" "NAMESPACE" "UIDPLUS" "LIST-EXTENDED" "I18NLEVEL=1" "CONDSTORE" "QRESYNC" "ESEARCH" "ESORT" "SEARCHRES" "WITHIN" "CONTEXT=SEARCH" "STARTTLS" "AUTH=PLAIN" "AUTH=LOGIN";
        }
    # IMAP TLS implicite (IMAPS)
     server {
        listen     993 ssl;
        starttls   off;
        protocol imap;
        proxy      on;
        imap_capabilities  "IMAP4rev1" "LITERAL+" "SASL-IR" "LOGIN-REFERRALS" "ID" "ENABLE" "SORT" "SORT=DISPLAY" "THREAD=REFERENCES" "THREAD=REFS" "MULTIAPPEND" "UNSELECT" "IDLE" "CHILDREN" "NAMESPACE" "UIDPLUS"
"LIST-EXTENDED" "I18NLEVEL=1" "CONDSTORE" "QRESYNC" "ESEARCH" "ESORT" "SEARCHRES" "WITHIN" "CONTEXT=SEARCH" "STARTTLS" "AUTH=PLAIN" "AUTH=LOGIN";
        ssl_verify_client   off;
        }
    }
