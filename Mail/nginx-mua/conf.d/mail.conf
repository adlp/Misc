mail {
    server_name smtp.example.com;
    proxy_pass_error_message on;
    proxy on;
 
    ssl_certificate      /etc/letsencrypt/live/imap.example.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/imap.example.com/privkey.pem;

    ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    # backends fournis en IP par dom2srv.txt/mailauth.pm : pas de résolution DNS nécessaire
    resolver off;
    #ssl_verify_client   off;
    # n'a d'effet que sur protocol smtp (transmet l'IP client réelle au backend) ;
    # désactivé explicitement dans les 2 server{} smtp ci-dessous
    xclient           on;
    # backend d'auth : voir http.conf + perl-lib/mailauth.pm
    auth_http         127.0.0.1:3615/auth;

    # SMTP submission, TLS implicite (SMTPS)
    server {
        listen     465 ssl;
        protocol   smtp;
        # xclient on : sûr uniquement parce que TOUTE la soumission SMTP est
        # routée vers pf-mua (service `smtp` local, cf. dom2srv.txt), qui
        # trust XCLIENT (smtpd_authorized_xclient_hosts = $mynetworks dans
        # etc+postfix/main.cf). pf-mua relaie ensuite vers le backend final
        # (relayhost) en SMTP normal, sans XCLIENT — le backend final n'a
        # donc jamais besoin de le supporter. Voir README, section
        # "xclient/PROXY protocol" + "pf-mua comme tampon de soumission".
        # ⚠️ Si une règle dom2srv.txt route un jour un backend SMTP
        # directement (sans passer par pf-mua), xclient casse tout le mail
        # pour ce backend s'il ne trust pas XCLIENT — vérifié en conditions
        # réelles (nginx envoie XCLIENT sans condition, sans vérifier
        # l'annonce EHLO du backend).
        xclient     on;
        smtp_auth  login plain;
        smtp_capabilities "AUTH PLAIN";
        proxy      on;
        timeout     5s;
        ssl_verify_client   off;
        auth_http         127.0.0.1:3615/auth;
        }
    # SMTP submission, TLS via STARTTLS (RFC 6409)
    server {
        proxy_pass_error_message on;
        #listen     587 proxy_protocol;
        listen     587;
        starttls   on;
        protocol   smtp;
        smtp_auth  login plain cram-md5;
        # xclient on : même raisonnement/même garde-fou que le bloc 465 ci-dessus
        # (sûr uniquement tant que la soumission passe par pf-mua).
        xclient     on;
        smtp_capabilities "PIPELINING" "ENHANCEDSTATUSCODES" "8BITMIME";
        proxy      on;
        # Monté de 30s à 60s : réduit les "lost connection after DATA" côté
        # backend causées par le proxy lui-même (clients mobiles, pièces
        # jointes volumineuses) plutôt que par une vraie coupure client.
        # Contrepartie : connexions tenues plus longtemps par worker si
        # quelqu'un ouvre puis traîne volontairement (charge/DoS un peu plus
        # facile à provoquer). Si error_log (nginx.conf) montre encore des
        # timeouts proxy légitimes après ce changement, remonter encore.
        timeout     60s;
        auth_http         127.0.0.1:3615/auth;
        }
    # POP3 clair + STARTTLS
    server {
        listen    110;
        starttls   on;
        protocol  pop3;
        pop3_auth plain apop cram-md5;
        proxy      on;
        }
    # POP3 TLS implicite (POP3S)
    server {
        listen     995 ssl;
        starttls   off;
        protocol   pop3;
        pop3_auth plain apop cram-md5;
        proxy      on;
        ssl_verify_client   off;
        }
    # IMAP clair + STARTTLS
    server {
        listen   143;
        starttls   on;
        protocol imap;
        proxy      on;
        imap_capabilities  "IMAP4rev1" "LITERAL+" "SASL-IR" "LOGIN-REFERRALS" "ID" "ENABLE" "SORT" "SORT=DISPLAY" "THREAD=REFERENCES" "THREAD=REFS" "MULTIAPPEND" "UNSELECT" "IDLE" "CHILDREN" "NAMESPACE" "UIDPLUS" "LIST-EXTENDED" "I18NLEVEL=1" "CONDSTORE" "QRESYNC" "ESEARCH" "ESORT" "SEARCHRES" "WITHIN" "CONTEXT=SEARCH" "STARTTLS" "AUTH=PLAIN" "AUTH=LOGIN";
        }
    # IMAP TLS implicite (IMAPS)
     server {
        listen     993 ssl;
        starttls   off;
        protocol imap;
        proxy      on;
        imap_capabilities  "IMAP4rev1" "LITERAL+" "SASL-IR" "LOGIN-REFERRALS" "ID" "ENABLE" "SORT" "SORT=DISPLAY" "THREAD=REFERENCES" "THREAD=REFS" "MULTIAPPEND" "UNSELECT" "IDLE" "CHILDREN" "NAMESPACE" "UIDPLUS"
"LIST-EXTENDED" "I18NLEVEL=1" "CONDSTORE" "QRESYNC" "ESEARCH" "ESORT" "SEARCHRES" "WITHIN" "CONTEXT=SEARCH" "STARTTLS" "AUTH=PLAIN" "AUTH=LOGIN";
        ssl_verify_client   off;
        }
    }
