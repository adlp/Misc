# backend d'auth interne pour mail.conf (auth_http) — jamais exposé publiquement
http {
        perl_modules perl/lib;
        perl_require mailauth.pm;
        server {
                # loopback only : ce endpoint ne fait aucune vérif d'accès lui-même
                listen 127.0.0.1:3615;
                location /auth {
                    perl mailauth::handler;
                    }
                }
        }
