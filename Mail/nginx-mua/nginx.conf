user  nginx;
worker_processes  auto;

# /dev/stderr, pas un fichier : capté par le driver syslog Docker du service
# nginx-mua (docker-compose.yml, tag "${SITE}") — même principe que maillog_file
# côté Postfix. Un fichier réel dans le conteneur ne serait jamais vu (pas de
# volume dessus) : ce n'était pas remonté avant ce changement.
error_log  /dev/stderr info;

pid        /var/run/nginx.pid;

# requis par conf.d/http.conf (bloc perl mailauth::handler)
load_module modules/ngx_http_perl_module.so;

events {
    worker_connections  1024;
    multi_accept        on;
}

include /etc/nginx/conf.d/*.conf;
