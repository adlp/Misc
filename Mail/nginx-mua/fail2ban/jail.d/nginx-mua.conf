# Jail fail2ban pour les échecs d'auth nginx-mua (mailauth.pm).
# À copier/lier dans /etc/fail2ban/jail.d/ sur le host qui reçoit les logs
# syslog de mailauth.pm (SYSLOG_SERVER dans .env) — pas forcément le host qui
# fait tourner le conteneur nginx-mua.
#
# logpath : où rsyslog écrit les messages reçus sur SYSLOG_PORT — dépend de la
# conf rsyslog du host receveur (adapter, ex. fichier dédié via une règle de
# routage rsyslog).
# port : services publics exposés par nginx-mua (cf. .env EXPO*).

[nginx-mua]
enabled  = true
filter   = nginx-mua
logpath  = /var/log/syslog
port     = 110,995,143,993,587
maxretry = 5
findtime = 600
bantime  = 3600
# Ne jamais bannir la boucle locale / IP d'admin de confiance :
ignoreip = 127.0.0.1/8 ::1
