# Filtre fail2ban pour les échecs d'auth loggués par perl-lib/mailauth.pm
#
# mailauth.pm envoie chaque tentative en syslog via Sys::Syslog, directement
# au serveur SYSLOG_SERVER:SYSLOG_PORT défini dans .env (UDP par défaut) —
# indépendamment des logs du conteneur nginx-mua lui-même (driver "syslog" de
# Docker, qui ne capture que stdout/stderr). Le host qui reçoit ces paquets
# doit avoir un rsyslog en écoute UDP sur ce port, ex. dans un fichier
# /etc/rsyslog.d/*.conf sur SYSLOG_SERVER :
#   module(load="imudp")
#   input(type="imudp" port="514")
#
# Ligne ciblée, tag TRACKER_F2B (valeur "TRACKER" dans l'exemple .env du
# README) suivi de "-Out" — adapter le tag ci-dessous si TRACKER_F2B diffère :
#   TRACKER-Out;<auth_ok>;<Host>;<Client-IP>;<Client-Host>;<Auth-User>;<Auth-Protocol>;<Auth-Method>;<Auth-Login-Attempt>;<match>;<backend-host>;<backend-port>;<status>
# auth_ok (2e champ) = 0 sur échec de login POP3 OU sur un motif matché par une
# règle KILL (tarpit, voir dom2srv.txt) ; = 1 sur succès, jamais matché ici.
# Le KILL génère plusieurs lignes TRACKER-Out;0;... pour une seule connexion
# (une par itération du tarpit) — un maxretry bas dans le jail suffit à bannir
# dès la première tentative sur un motif déjà connu comme malveillant.
#
# Préfixe syslog non ancré (.*) : l'ident nginx (openlog) contient des valeurs
# dynamiques (protocole/user courant), donc pas de préfixe fixe à matcher.
#
# Non vérifié avec fail2ban-regex sur un serveur réel (pas d'instance
# disponible au moment de l'écriture) — juste validé par regex Python
# équivalente sur une ligne construite à partir du code. À revalider avant
# activation en prod :
#   fail2ban-regex /var/log/syslog /etc/fail2ban/filter.d/nginx-mua.conf

[Definition]

failregex = ^.*TRACKER-Out;0;[^;]*;<HOST>;

ignoreregex =
