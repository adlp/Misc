# Snippet a inclure DANS un server{}, AVANT toute location{} -- sinon une
# IP bannie pourrait matcher une location normale (proxy_pass vers le
# backend reel) avant d'atteindre ce bloc.
#
# Principe : if() place directement dans server{} (pas dans une
# location) s'evalue en phase de reecriture serveur, avant le dispatch
# vers les location{} -- une IP bannie ne touche donc JAMAIS un backend
# normal. return CODE "payload litteral" repond directement, sans
# passer par une location/alias/error_page -- ces mecanismes ont ete
# testes en profondeur (voir CHANGELOG) et ne fonctionnent pas de
# facon fiable dans certains environnements nginx pour rediriger en
# interne vers une location cible, meme hors if/internal, meme pour
# une erreur organique. return CODE "texte" est la seule methode
# constatee fiable pour a la fois choisir le code HTTP ET servir un
# contenu. limit_rate ralentit ce contenu comme n'importe quelle
# reponse (tarpit : connexion ouverte au debit configure au lieu de
# rejeter vite).
#
# Contrepartie : le payload est en dur dans ce fichier (pas de fichier
# externe possible avec cette methode). Regenerer avec une taille ou un
# texte different :
#   python3 -c "
#   line = 'Please wait, your request is being processed. Do not close this connection.'
#   n = 3000 // (len(line) + 1)  # <-- ajuster 3000 (octets cible)
#   print('\n'.join([line]*n) + '\n', end='')
#   "
# Puis remplacer le texte entre guillemets ci-dessous. Attention aux
# caracteres a echapper si le texte change : \" pour un guillemet, \\
# pour un backslash, \$ pour un dollar litteral (sinon interprete comme
# variable nginx).
#
# Changer le code retourne (403 par defaut) : modifier uniquement le
# nombre juste apres "return" ci-dessous. Codes usuels : 403 (refuse),
# 429 (too many requests), 503 (indisponible). Eviter 444 (specifique
# nginx : coupe la connexion sans reponse -- incompatible avec le
# principe meme du tarpit, qui doit garder la connexion ouverte).
#
# Installation, dans chaque server{} a proteger (apres avoir inclus
# geo-badguys.conf au niveau http{}) :
#   server {
#       ...
#       include /etc/nginx/include.d/tarpit-server.conf;
#       ...
#       location / {
#           proxy_pass http://backend_normal;   # jamais atteint par une IP bannie
#       }
#   }
#
# Ajuster le debit : map $is_banned $tarpit_rate dans geo-badguys.conf
# (defaut : 100 octets/s). Duree du tarpit ~= taille du payload ci-dessous
# / debit -- ~2964 octets ⇒ ~30s a 100 octets/s. Garder le payload assez
# gros : une reponse trop petite tient dans un seul paquet et part quasi
# instantanement quel que soit limit_rate.

limit_rate $tarpit_rate;

if ($is_banned) {
    return 403 "Please wait, your request is being processed. Do not close this connection.
