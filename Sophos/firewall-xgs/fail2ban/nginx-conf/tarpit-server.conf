# Snippet à inclure DANS un server{}, AVANT toute location{} — sinon une
# IP bannie pourrait matcher une location normale (proxy_pass vers le
# backend réel) avant d'atteindre ce bloc.
#
# Principe : if() placé directement dans server{} (pas dans une
# location) s'évalue en phase de réécriture serveur, avant le dispatch
# vers les location{} — une IP bannie ne touche donc JAMAIS un backend
# normal. Le contenu servi est ralenti via limit_rate (tarpit : la
# connexion reste ouverte au débit configuré au lieu de rejeter vite).
#
# Installation, dans chaque server{} à protéger (après avoir inclus
# geo-badguys.conf au niveau http{}) :
#   server {
#       ...
#       include /etc/nginx/include.d/tarpit-server.conf;
#       ...
#       location / {
#           proxy_pass http://backend_normal;   # jamais atteint par une IP bannie
#       }
#   }
#
# Ajuster le débit : map $is_banned $tarpit_rate dans geo-badguys.conf
# (défaut : 10 octets/s). Ajuster la durée du tarpit : taille de
# tarpit/payload.txt — durée ≈ taille_fichier / débit. Le fichier fourni
# fait ~3000 octets ⇒ ~5 min à 10 octets/s. Le payload doit rester assez
# gros : une réponse trop petite tient dans un seul paquet et part
# quasi instantanément quel que soit limit_rate.

limit_rate $tarpit_rate;

if ($is_banned) {
    rewrite ^ /__tarpit__ last;
}

location = /__tarpit__ {
    internal;
    alias /etc/nginx/tarpit/payload.txt;
    default_type text/plain;
}
