# Snippet à inclure au niveau http{} (ou dans chaque server{} concerné)
# QUAND nginx est derrière un reverse-proxy applicatif qui termine la
# connexion et se re-connecte à nginx avec SA PROPRE IP source (ex:
# Sophos XGS en mode "Web Server Protection" / WAF — pas un simple
# DNAT/port-forward, qui lui préserve l'IP source).
#
# Sans ce module, $remote_addr = l'IP du reverse-proxy (Sophos), jamais
# celle du client réel : geo-badguys.conf ne matcherait donc jamais la
# bonne IP, et les logs nginx seraient inexploitables pour fail2ban.
#
# Prérequis côté Sophos : la règle Web Server Protection doit transmettre
# l'IP client dans un header (souvent X-Forwarded-For, à CONFIRMER dans
# l'écran d'édition de la règle — le libellé exact varie selon firmware).
# Vérifier avant d'activer : logguer temporairement $http_x_forwarded_for
# (et éventuellement $http_x_real_ip) pour une requête externe, comparer
# à l'IP publique réelle utilisée pour le test.
#
# Installation, dans nginx.conf :
#   http {
#       ...
#       include /etc/nginx/include.d/realip.conf;
#       ...
#   }

set_real_ip_from  192.0.2.1;         # <-- IP interne du Sophos XGS, à adapter
real_ip_header    X-Forwarded-For;   # <-- à confirmer (étape ci-dessus)
