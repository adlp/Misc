# Snippet à inclure au niveau http{} -- limit_req_zone n'est valide QUE
# dans ce contexte (même règle que geo/map, voir geo-badguys.conf).
#
# Rate-limiting nginx natif, en complément de fail2ban : fail2ban est
# réactif (lit les logs, puis bannit) et ne peut pas empêcher les
# quelques dizaines/centaines de requêtes qu'un bot envoie AVANT que le
# ban soit effectif (latence lecture log + action, ex: 5-8s pour l'API
# Sophos). limit_req agit en temps réel, sans latence externe -- il
# encaisse le choc immédiat, fail2ban prend le relais pour un ban
# permanent une fois le pattern confirmé dans les logs.
#
# Exempte les IP privées (RFC1918) vues comme IP "réelle" ($remote_addr,
# après realip si configuré -- voir realip.conf) du rate-limiting :
# utile si un équipement interne (le Sophos lui-même, un check de
# santé, un script d'admin...) fait des requêtes via la même chaîne XFF
# et ne doit pas être ralenti comme un bot externe.
#
# ATTENTION : si le vhost protégé n'a PAS realip.conf inclus (voir son
# README), $remote_addr vaut l'IP interne du proxy/passerelle docker,
# pas l'IP XFF -- dans ce cas, adapter le `geo` ci-dessous pour tester
# $http_x_forwarded_for à la place (plus complexe : XFF peut contenir
# une chaîne "ip1, ip2", nécessite un map supplémentaire pour extraire
# la 1ère IP avant de tester la plage RFC1918).

geo $remote_addr $ratelimit_exempt_ip {
    default         0;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
}

# Exempte aussi les requêtes authentifiées : $remote_user n'est renseigné
# par nginx (auth_basic, auth_request avec $upstream_http_... remappé sur
# $remote_user, etc.) que si l'authentification a réussi -- vide sinon.
# Ne PAS confondre avec l'affichage "-" en log (c'est juste le format
# du log, $remote_user lui-même reste une chaîne vide).
map $remote_user $ratelimit_exempt_user {
    default 1;
    ""      0;
}

# Combine les deux exemptions (IP RFC1918 OU authentifié) : concatène les
# deux flags 0/1 puis teste si le résultat contient au moins un "1".
map "$ratelimit_exempt_ip$ratelimit_exempt_user" $ratelimit_key {
    default $binary_remote_addr;
    "~1"    "";
}

# Clé vide ($ratelimit_key = "") pour une IP exemptée : nginx désactive
# le rate-limiting pour cette requête (comportement documenté de
# limit_req_zone -- une clé vide n'est jamais comptée).
#
# rate=10r/s : 10 requêtes/s max par IP (hors exemptées). Ajuster selon
# le trafic légitime réel du site. burst/nodelay : voir
# ratelimit-server.conf.
limit_req_zone $ratelimit_key zone=perip:10m rate=10r/s;
