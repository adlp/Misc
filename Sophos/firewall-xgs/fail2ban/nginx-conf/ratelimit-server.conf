# Snippet à inclure DANS un server{}, avant les location{} -- comme
# tarpit-server.conf (mais indépendant : les deux peuvent être inclus
# ensemble ou séparément). Nécessite ratelimit.conf inclus au niveau
# http{}.
#
# burst=20 : autorise une rafale ponctuelle de 20 requêtes au-dessus du
# débit nominal (rate=10r/s, voir ratelimit.conf) avant de rejeter --
# absorbe les pics légitimes (navigateur qui charge plusieurs assets
# d'un coup) sans les bloquer.
# nodelay : les requêtes en excès dans le burst sont traitées
# immédiatement (pas de mise en file d'attente/ralentissement) --
# au-delà du burst, rejet direct.
#
# limit_req_status 429 : nginx renvoie 503 par défaut pour des raisons
# historiques (limit_req existait avant la normalisation du code 429
# "Too Many Requests", RFC 6585, 2012) -- 429 est sémantiquement plus
# correct pour un rate-limit.
#
# Ajuster rate dans ratelimit.conf et burst ci-dessous selon le trafic
# légitime réel du site (surveiller les 429 dans les logs après mise en
# prod pour détecter un seuil trop bas).

limit_req_status 429;
limit_req zone=perip burst=20 nodelay;
