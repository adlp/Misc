# Snippet à inclure au niveau http{} — geo/map ne sont valides QUE dans
# ce contexte (erreur "geo directive is not allowed here" si inclus
# depuis un server{}/location{}).
#
# Installation, dans nginx.conf :
#   http {
#       ...
#       include /etc/nginx/include.d/geo-badguys.conf;
#       ...
#       server { ... }
#   }
#
# Alimenté par nginx_fw_block.py (voir ../nginx_fw_block.py,
# ../nginx.conf.example) : badguys.map est réécrit puis nginx rechargé à
# chaque ban/unban. Une IP par ligne, format "1.2.3.4 1;".

geo $remote_addr $is_banned {
    default 0;
    include /etc/nginx/include.d/badguys.map;
}

# Débit (octets/s) appliqué via limit_rate selon $is_banned — voir
# tarpit-server.conf. 0 = illimité (utilisateurs normaux).
map $is_banned $tarpit_rate {
    default 0;
    1       10;
}
