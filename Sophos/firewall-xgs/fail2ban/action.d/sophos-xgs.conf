# Action fail2ban : bloque/débloque une IP via un IPHostGroup Sophos Firewall (XGS).
#
# Installation :
#   cp sophos-xgs.conf /etc/fail2ban/action.d/
#
# Utilisation dans jail.local :
#   [sshd]
#   enabled = true
#   action  = %(action_)s
#             sophos-xgs

[Definition]
actionban = /usr/local/bin/sophos_fw_block.py ban <ip>
actionunban = /usr/local/bin/sophos_fw_block.py unban <ip>

[Init]
