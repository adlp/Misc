# Action fail2ban : bloque/débloque une IP via un IPHostGroup Sophos Firewall (XGS).
#
# Installation :
#   cp sophos-xgs.conf /etc/fail2ban/action.d/
#
# Utilisation dans jail.local :
#   [sshd]
#   enabled = true
#   action  = %(action_)s
#             sophos-xgs
#
# Plusieurs jails partageant le même group/iplist (ex sshd ET
# nginx-http-auth poussées vers le même IPHostGroup) : ajouter la même
# action dans CHAQUE jail concernée, et lister TOUTES ces jails dans
# `jail = ...` côté api.conf (séparées par des virgules, voir
# sophos_fw_block.py --help) -- indispensable, car ban/unban interrogent
# `jail` pour reconstruire la liste COMPLÈTE poussée sur le firewall ;
# n'y lister qu'une seule jail écraserait le groupe avec les seules IP
# de cette jail et effacerait celles bannies par les autres :
#
#   [sshd]
#   enabled = true
#   action  = %(action_)s
#             sophos-xgs
#
#   [nginx-http-auth]
#   enabled = true
#   action  = %(action_)s
#             sophos-xgs
#
#   # api.conf : jail = sshd,nginx-http-auth
#
# Jails avec des comportements DISTINCTS (ex sshd -> groupe de blocage
# permanent, nginx-scanners -> groupe/IP list séparé, éventuellement sur
# un tout autre firewall) : les paramètres group/iplist/prefix/config
# ci-dessous (repris tels quels des options CLI --group/--iplist/
# --prefix/--config du script) se surchargent PAR JAIL, entre crochets,
# sans toucher à api.conf ni aux autres jails :
#
#   [sshd]
#   enabled = true
#   action  = %(action_)s
#             sophos-xgs
#
#   [nginx-scanners]
#   enabled = true
#   action  = %(action_)s
#             sophos-xgs[group="Fail2Ban-Scanners", prefix="scan_"]
#
# Ou carrément un fichier de config API distinct (firewall différent,
# credentials différents...) :
#
#   [nginx-scanners]
#   action = sophos-xgs[config="/usr/local/etc/sophos-fw/api-scanners.conf"]
#
# `group`/`iplist`/`prefix` vides (défaut) laissent api.conf décider,
# comme un `ban`/`unban` lancé sans ces options CLI ; `config` vide
# n'est PAS accepté par le script (chemin obligatoire), d'où sa valeur
# par défaut ci-dessous alignée sur DEFAULT_CONFIG_PATH.
#
# Exécuté via systemd-run --no-block : l'API Sophos peut prendre 5-8s
# par appel (traitement côté firewall, voir CHANGELOG/README) — fail2ban
# ne doit pas attendre ce délai avant de traiter l'événement suivant.
# Contrepartie : un échec de ban/unban n'apparaît plus dans les logs
# fail2ban, seulement via syslog (tag sophos-fw-block) / journalctl.

[Definition]
actionban = systemd-run --quiet --no-block /usr/local/bin/sophos_fw_block.py ban <ip> --config "<config>" --group "<group>" --iplist "<iplist>" --prefix "<prefix>"
actionunban = systemd-run --quiet --no-block /usr/local/bin/sophos_fw_block.py unban <ip> --config "<config>" --group "<group>" --iplist "<iplist>" --prefix "<prefix>"

[Init]
# chemin par défaut du script (voir DEFAULT_CONFIG_PATH dans sophos_fw_block.py) --
# surcharger pour pointer un jail vers un firewall/compte API distinct.
config = /usr/local/etc/sophos-fw/api.conf
# vides par défaut : n'écrasent alors rien (le script ignore un
# --group/--iplist/--prefix vide et retombe sur api.conf, voir --help).
group =
iplist =
prefix =
