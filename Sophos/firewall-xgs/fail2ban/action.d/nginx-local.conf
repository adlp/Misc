# Action fail2ban : bloque/débloque une IP via un fichier geo-map nginx
# local (rechargé par un reload nginx), indépendamment de Sophos.
#
# Installation :
#   cp nginx-local.conf /etc/fail2ban/action.d/
#
# Utilisation dans jail.local (peut être combinée avec sophos-xgs) :
#   [php-404]
#   enabled = true
#   action  = sophos-xgs
#             nginx-local
#
# Exécuté via systemd-run --no-block, cohérent avec sophos-xgs.conf (même
# jail, même principe) même si le reload nginx est généralement plus
# rapide que l'API Sophos. Contrepartie : un échec n'apparaît plus dans
# les logs fail2ban, seulement via syslog (tag nginx-fw-block) / journalctl.

[Definition]
actionban = systemd-run --quiet --no-block /usr/local/bin/nginx_fw_block.py ban <ip>
actionunban = systemd-run --quiet --no-block /usr/local/bin/nginx_fw_block.py unban <ip>

[Init]
