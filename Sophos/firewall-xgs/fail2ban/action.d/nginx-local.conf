# Action fail2ban : bloque/débloque une IP via un fichier geo-map nginx
# local (rechargé par un reload nginx), indépendamment de Sophos.
#
# Installation :
#   cp nginx-local.conf /etc/fail2ban/action.d/
#
# Utilisation dans jail.local (peut être combinée avec sophos-xgs) :
#   [php-404]
#   enabled = true
#   action  = sophos-xgs
#             nginx-local
#
# Plusieurs jails partageant le même map_file (ex php-404 ET
# nginx-botsearch poussées vers le même fichier geo-map) : ajouter la
# même action dans CHAQUE jail concernée, et lister TOUTES ces jails
# dans `jail = ...` côté nginx.conf (séparées par des virgules, voir
# nginx_fw_block.py --help) -- utile pour `start` (resynchro complète
# depuis fail2ban) : sans ça, `start` ne verrait que les bans d'UNE
# jail et régénèrerait un fichier incomplet. Sans effet sur ban/unban
# eux-mêmes (I/O locale sur map_file, ne consultent jamais `jail`) :
#
#   [php-404]
#   enabled = true
#   action  = sophos-xgs
#             nginx-local
#
#   [nginx-botsearch]
#   enabled = true
#   action  = sophos-xgs
#             nginx-local
#
#   # nginx.conf : jail = php-404,nginx-botsearch
#
# Jails avec des comportements DISTINCTS (ex php-404 -> map_file "dur"
# 403 immédiat, scanner-404-403 -> map_file séparé consommé par un vhost
# en tarpit, voir nginx-conf/) : les paramètres map_file/reload_cmd/
# config ci-dessous (repris des options CLI --map-file/--reload-cmd/
# --config du script) se surchargent PAR JAIL, entre crochets, sans
# toucher à nginx.conf ni aux autres jails :
#
#   [php-404]
#   enabled = true
#   action  = nginx-local
#
#   [scanner-404-403]
#   enabled = true
#   action  = nginx-local[map_file="/etc/nginx/include.d/tarpit_ips.conf"]
#
# `map_file`/`reload_cmd` vides (défaut) laissent nginx.conf décider,
# comme un `ban`/`unban` lancé sans ces options CLI ; `config` vide
# n'est PAS accepté par le script (chemin obligatoire), d'où sa valeur
# par défaut ci-dessous alignée sur DEFAULT_CONFIG_PATH. Un `reload_cmd`
# contenant des espaces (ex Docker) doit rester entre guillemets :
# action = nginx-local[reload_cmd="docker exec mon-nginx nginx -s reload"]
#
# Exécuté via systemd-run --no-block, cohérent avec sophos-xgs.conf (même
# jail, même principe) même si le reload nginx est généralement plus
# rapide que l'API Sophos. Contrepartie : un échec n'apparaît plus dans
# les logs fail2ban, seulement via syslog (tag nginx-fw-block) / journalctl.

[Definition]
actionban = systemd-run --quiet --no-block /usr/local/bin/nginx_fw_block.py ban <ip> --config "<config>" --map-file "<map_file>" --reload-cmd "<reload_cmd>"
actionunban = systemd-run --quiet --no-block /usr/local/bin/nginx_fw_block.py unban <ip> --config "<config>" --map-file "<map_file>" --reload-cmd "<reload_cmd>"

[Init]
# chemin par défaut du script (voir DEFAULT_CONFIG_PATH dans nginx_fw_block.py) --
# surcharger pour pointer un jail vers une config nginx-fw-block distincte.
config = /usr/local/etc/nginx-fw-block.conf
# vides par défaut : n'écrasent alors rien (le script ignore un
# --map-file/--reload-cmd vide et retombe sur la config, voir --help).
map_file =
reload_cmd =
