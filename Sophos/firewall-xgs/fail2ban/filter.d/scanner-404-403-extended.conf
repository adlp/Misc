# Détecte un comportement de scanner de site : trop de requêtes en 404
# ou 403, sur N'IMPORTE QUEL chemin (contrairement à php-404-extended.conf
# qui cible des chemins précis PHP/WordPress). Le "trop" vient du
# maxretry/findtime de la jail — ce filtre matche juste "requête en
# erreur 404/403", fail2ban fait le comptage.
#
# Format de log attendu : voir php-404-extended.conf pour le détail du
# log_format "extended" (IP réelle dans $remote_addr).
#
# ignoreregex exclut les 404 bénins fréquents (favicon/robots/touch-icon)
# demandés automatiquement par les navigateurs — sinon un visiteur normal
# avec un favicon manquant + un robots.txt absent peut se rapprocher du
# seuil pour rien. Adapter/étoffer selon les assets connus manquants sur
# ton site.
#
# Prérequis : jail avec un maxretry assez haut et un findtime court pour
# ne cibler que des RAFALES (comportement scanner), pas quelques 404
# occasionnels d'un visiteur normal (lien cassé, etc.) — voir exemple de
# jail dans le README principal.
#
# Réglage observé en conditions réelles : un scanner génère ~10 erreurs
# 404/403 par seconde. maxretry=10 / findtime=3 détecte donc un scan en
# ~1s réel (marge de sécurité sur le findtime), largement hors de portée
# d'un visiteur normal. Plus agressif possible (maxretry=5 findtime=1,
# ban en ~0.5s) au prix d'un peu moins de marge sur un cas limite
# légitime improbable.

[Definition]

failregex = ^\S+ - \S+ - \S+ - \S+ - (<HOST>)/\S* \(\d+\) - \S+ \[[^\]]+\] "\S+ \S+ HTTP/\d\.\d" HTTP:(404|403)

ignoreregex = "(GET|HEAD) /favicon\.ico HTTP
               "(GET|HEAD) /robots\.txt HTTP
               "(GET|HEAD) /apple-touch-icon[^ ]* HTTP
