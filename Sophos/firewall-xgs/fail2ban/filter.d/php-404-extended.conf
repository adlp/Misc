# Variante de php-404.conf pour le log_format nginx "extended" (IP
# réelle déjà dans $remote_addr grâce à ngx_http_realip_module — pas en
# dernier champ comme dans php-404.conf) :
#
#   log_format extended '$hostname - $server_name - $host - $upstream_addr - $remote_addr/$http_x_forwarded_for ($connection_requests) - $remote_user [$time_local] '
#                        '"$request" HTTP:$status b:$bytes_sent rt:$request_time ut:$upstream_response_time - '
#                        '"$http_referer" "$http_user_agent" '
#                        '"$gzip_ratio"';
#
# Exemple de ligne (probe WordPress sur un backend qui n'a pas de PHP,
# ex: Authentik derrière ce vhost — répond 404 comme n'importe quel
# chemin inexistant) :
#   myhost - authentik.example.com - authentik.example.com - 172.18.0.5:9000 - 34.123.45.67/- (3) - - [13/Aug/2026:10:00:00 +0000] "GET /wp-login.php HTTP/1.1" HTTP:404 b:162 rt:0.001 ut:0.001 - "-" "Mozilla/5.0" "-"
#
# Détecte les sondes vers des scripts PHP inexistants (404) ainsi que
# les scans de chemins WordPress classiques. "HTTP:404" est littéral :
# une requête PHP/WordPress qui répond 200 (cas normal d'une appli qui
# a réellement ces chemins) ne matche jamais.
#
# Variante "snmain" (autre vhost, $server_name en 1ère colonne, IP réelle
# dans $http_x_forwarded_for — $remote_addr y est l'IP interne du Sophos,
# realip non appliqué sur ce format) :
#
#   log_format snmain '$server_name $remote_addr - $remote_user [$time_local] "$request" '
#                      '$status $body_bytes_sent "$http_referer" '
#                      '"$http_user_agent" "$http_x_forwarded_for"';
#
# Exemple de ligne :
#   www.example.com 192.168.2.1 - - [18/Aug/2026:08:35:34 +0000] "GET /wp-login.php HTTP/1.1" 404 1641 "-" "Mozilla/5.0" "34.123.45.67"
#
# Statut en clair ("404", pas "HTTP:404") ; HOST pris dans le dernier
# champ ($http_x_forwarded_for) avec [^"]* après pour tolérer une chaîne
# de proxies ("ip1, ip2, ...") — seule la 1ère IP (client d'origine) sert
# de HOST.

[Definition]

failregex = ^\S+ - \S+ - \S+ - \S+ - (<HOST>)/\S* \(\d+\) - \S+ \[[^\]]+\] "(GET|POST|HEAD) \S*\.(php|php7|php8)(\?\S*)? HTTP/\d\.\d" HTTP:404
            ^\S+ - \S+ - \S+ - \S+ - (<HOST>)/\S* \(\d+\) - \S+ \[[^\]]+\] "(GET|POST|HEAD) \S*(wp-login|wp-admin|xmlrpc|wp-content|wp-includes|wordpress)\S* HTTP/\d\.\d" HTTP:404
            ^\S+ \S+ - \S+ \[[^\]]+\] "(GET|POST|HEAD) \S*\.(php|php7|php8)(\?\S*)? HTTP/\d\.\d" 404 \d+ "[^"]*" "[^"]*" "(<HOST>)[^"]*"
            ^\S+ \S+ - \S+ \[[^\]]+\] "(GET|POST|HEAD) \S*(wp-login|wp-admin|xmlrpc|wp-content|wp-includes|wordpress)\S* HTTP/\d\.\d" 404 \d+ "[^"]*" "[^"]*" "(<HOST>)[^"]*"

ignoreregex =
