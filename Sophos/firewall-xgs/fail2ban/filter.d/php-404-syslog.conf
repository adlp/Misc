# Variante de php-404-extended.conf pour des logs nginx reçus via syslog
# (ex: conteneur nginx qui logue sur stdout, capté par rsyslog/docker
# logging driver, avec le tag programme "nginx[pid]:"). Même structure
# de champs que le log_format "extended" (voir php-404-extended.conf),
# mais précédée d'une enveloppe syslog, et SANS realip : l'IP réelle est
# donc dans $http_x_forwarded_for (après le "/"), pas dans $remote_addr
# (qui vaut l'IP interne du proxy/passerelle docker, ex: 10.1.32.1).
#
# Exemple de ligne réelle (probe sur un backend Authentik, ici une
# requête légitime à 200 — ne matche jamais) :
#   2026-08-18T16:02:37+02:00 localhost nginx[1692]: nginx - authentik.example.com - authentik.example.com - 172.17.0.1:5443 - 10.1.32.1/1.2.3.4 (1) - - [18/Aug/2026:16:02:37 +0200] "GET /api/v3/flows/executor/... HTTP/1.1" HTTP:200 b:1357 rt:2.503 ut:2.503 - "-" "goauthentik.io/outpost/2026.5.6" "-"
#
# L'ancre "nginx\[\d+\]: " (tag+pid syslog) sert de point de repère
# stable en début de match — insensible au format exact du timestamp
# syslog ou au hostname local, contrairement à un ancrage ^ en début de
# ligne (utilisé dans php-404-extended.conf, où il n'y a pas d'enveloppe
# syslog à traverser).
#
# Une ligne sans XFF (accès direct/local, $http_x_forwarded_for à "-")
# ne matche pas : "-" n'est pas une IP/hostname valide pour <HOST>, donc
# rien n'est banni sur cette ligne (comportement attendu — pas d'IP
# externe à identifier).

[Definition]

failregex = nginx\[\d+\]: \S+ - \S+ - \S+ - \S+ - \S+/(<HOST>) \(\d+\) - \S+ \[[^\]]+\] "(GET|POST|HEAD) \S*\.(php|php7|php8)(\?\S*)? HTTP/\d\.\d" HTTP:404
            nginx\[\d+\]: \S+ - \S+ - \S+ - \S+ - \S+/(<HOST>) \(\d+\) - \S+ \[[^\]]+\] "(GET|POST|HEAD) \S*(wp-login|wp-admin|xmlrpc|wp-content|wp-includes|wordpress)\S* HTTP/\d\.\d" HTTP:404

ignoreregex =
