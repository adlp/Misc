# Détecte les sondes vers des scripts PHP inexistants (404) ainsi que
# les scans de chemins WordPress classiques (wp-login, wp-admin,
# xmlrpc.php, etc). Le code "404" est littéral dans chaque failregex :
# une requête PHP ou WordPress qui répond 200 ne matche jamais.
#
# Format de log attendu (combined + IP réelle en dernier champ, ex: logs
# derrière proxy/CDN où l'IP client réelle est ajoutée en fin de ligne) :
#   192.168.2.1 - - [06/Aug/2026:13:53:05 +0000] "GET /xmlrpc.php?rsd HTTP/1.1" 404 5140 "-" "Mozilla/5.0" "34.22.236.107"
#                                                                                                              ^^^^^^^^^^^^^^ IP réelle bannie, pas le proxy en tête de ligne

[Definition]

failregex = ^\S+ - .+ "(GET|POST|HEAD) .*\.(php|php7|php8)(\?.*)? HTTP/\d\.\d" 404 .+ "(<HOST>)"$
            ^\S+ - .+ "(GET|POST|HEAD) .*(wp-login|wp-admin|xmlrpc|wp-content|wp-includes|wordpress).*HTTP/\d\.\d" 404 .+ "(<HOST>)"$

ignoreregex =
