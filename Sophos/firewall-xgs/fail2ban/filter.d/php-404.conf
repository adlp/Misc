# Détecte les requêtes vers des scripts PHP inexistants (404) — sondages
# de vulnérabilité classiques (xmlrpc.php, wp-login.php, phpmyadmin, etc).
# Une requête PHP qui répond 200 ne matche jamais : le code "404" est
# littéral dans le failregex.
#
# Format de log attendu (combined + IP réelle en dernier champ, ex: logs
# derrière proxy/CDN où l'IP client réelle est ajoutée en fin de ligne) :
#   192.168.2.1 - - [06/Aug/2026:13:53:05 +0000] "GET /xmlrpc.php?rsd HTTP/1.1" 404 5140 "-" "Mozilla/5.0" "34.22.236.107"
#                                                                                                              ^^^^^^^^^^^^^^ IP réelle bannie, pas le proxy en tête de ligne
#
# Si vos logs n'ont PAS ce dernier champ (pas de proxy devant, IP réelle
# = premier champ), utilisez la variante commentée ci-dessous à la place.

[Definition]

failregex = ^\S+ \S+ \S+ \[[^\]]+\] "(?:GET|POST|HEAD)\s+\S*\.php(?:[/?]\S*)?\s+HTTP/\d\.\d" 404 \d+ "[^"]*" "[^"]*" "<HOST>"\s*$

# Variante sans proxy/CDN (IP réelle = champ de tête) :
# failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "(?:GET|POST|HEAD)\s+\S*\.php(?:[/?]\S*)?\s+HTTP/\d\.\d" 404 \d+ .*$

ignoreregex =
