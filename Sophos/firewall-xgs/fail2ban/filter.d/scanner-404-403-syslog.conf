# Variante syslog de scanner-404-403-extended.conf : voir
# php-404-syslog.conf pour le détail du format de log (enveloppe syslog
# + IP réelle dans $http_x_forwarded_for, pas $remote_addr).
#
# Détecte un comportement de scanner générique — trop de requêtes en
# 404 ou 403, sur N'IMPORTE QUEL chemin. Le "trop" vient du
# maxretry/findtime de la jail (voir README pour un exemple de jail).
#
# ignoreregex exclut les 404 bénins fréquents (favicon/robots/touch-icon).

[Definition]

failregex = nginx\[\d+\]: \S+ - \S+ - \S+ - \S+ - \S+/(<HOST>) \(\d+\) - \S+ \[[^\]]+\] "\S+ \S+ HTTP/\d\.\d" HTTP:(404|403)

ignoreregex = "(GET|HEAD) /favicon\.ico HTTP
               "(GET|HEAD) /robots\.txt HTTP
               "(GET|HEAD) /apple-touch-icon[^ ]* HTTP
