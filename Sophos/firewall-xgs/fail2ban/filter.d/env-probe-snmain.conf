# Détecte les sondes vers des fichiers .env (secrets/config exposés) —
# .env, .env.local, .env.production, .env.example, .env.bak,
# .env.backup, /api/.env, etc. Format de log "snmain" (voir
# php-404-extended.conf pour le détail complet du format et son
# historique) : $server_name en 1ère colonne, IP réelle dans
# $http_x_forwarded_for (dernier champ), statut HTTP en clair (pas de
# préfixe "HTTP:").
#
# Exemple de ligne (probe réel, bot légitime au demeurant — Amazonbot —
# mais un scan de .env reste un scan) :
#   www.someol.com 34.73.93.163 - - [20/Aug/2026:11:11:53 +0200] "GET /.env HTTP/1.1" 404 1641 "-" "Mozilla/5.0 (compatible; Amazonbot/0.1; +https://developer.amazon.com/support/amazonbot)" "34.73.93.163"
#
# Tolère une chaîne XFF ("ip1, ip2") — seule la 1ère IP (client
# d'origine) sert de HOST. "404" littéral : un .env qui existerait
# réellement (200) ne matche jamais.
#
# Faux positif possible, improbable en pratique : un chemin qui
# contient "/.env" en préfixe sans être un fichier .env (ex:
# /.environment.js) matcherait aussi — adapter si ton site a un tel
# chemin légitime.

[Definition]

failregex = ^\S+ \S+ - \S+ \[[^\]]+\] "(GET|POST|HEAD) \S*/\.env\S* HTTP/\d\.\d" 404 \d+ "[^"]*" "[^"]*" "(<HOST>)[^"]*"$

ignoreregex =
